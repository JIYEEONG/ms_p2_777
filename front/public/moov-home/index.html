<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>MOOV 홈 · 택시와 렌트</title>
  <link rel="stylesheet" href="css/home.css" />
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></symbol>
      <symbol id="i-space" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 4v16M16 4v16M3 10h18M3 15h18"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></symbol>
      <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="i-car" viewBox="0 0 24 24"><path d="m5 17-1-5 2-5h12l2 5-1 5z"/><path d="M6 17v2M18 17v2M4 12h16M8 15h.01M16 15h.01"/></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3M14 9l2 2"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6" rx="1"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/></symbol>
      <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l1 13H4z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M17 9h4M3 15h4M17 15h4"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 5 13 3h-2L9.5 5H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="4"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 15-5-5L5 20"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2 2 0 0 1 3 3L8 18l-4 1 1-4z"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    </svg>
  <main class="stage">
    <section class="phone-shell" aria-label="MOOV 홈">
      <div class="phone-top">
          <span id="clock">9:41</span>
          <span class="phone-status" aria-label="휴대폰 상태: 신호, 와이파이, 배터리 충전 중">
            <span class="signal-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="wifi-mark" aria-hidden="true"></span>
            <span class="battery-ui charging" aria-hidden="true"><b></b><i></i></span>
          </span>
        </div>
      <section id="app" class="screen screen-active app-screen">
        <header class="app-header">
          <a class="eyebrow home-logo" href="#home" aria-label="MOOV 홈으로">Moov</a>
          <div class="header-actions">
            <button class="icon-button status-button" data-action="open-status" aria-label="차량 상태"><span class="status-dot"></span><svg><use href="#i-car"></use></svg></button>
            <button class="header-profile" data-action="header-profile" aria-label="내 정보"><svg><use href="#i-user"></use></svg></button>
          </div>
        </header>
        <div id="app-content" class="app-content" tabindex="-1"></div>
        <nav class="bottom-nav" aria-label="메인 메뉴">
          <button data-tab="ai"><svg><use href="#i-chat"></use></svg><span>AI 말동무</span></button>
          <button data-tab="space"><svg><use href="#i-space"></use></svg><span>공간</span></button>
          <button data-tab="home" class="nav-active" aria-current="page"><svg><use href="#i-home"></use></svg><span>홈</span></button>
          <button data-tab="outing"><svg><use href="#i-compass"></use></svg><span>나들이</span></button>
          <button data-tab="profile"><svg><use href="#i-user"></use></svg><span>내 정보</span></button>
        </nav>
      </section>
      <div id="modal" class="modal-backdrop" aria-hidden="true">
        <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <div class="modal-head"><div id="modal-icon" class="modal-icon"></div><button class="modal-close" data-action="close-modal" aria-label="팝업 닫기"><svg><use href="#i-x"></use></svg></button></div>
          <h3 id="modal-title"></h3><div id="modal-body"></div><div id="modal-actions" class="modal-actions"></div>
        </section>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div class="home-indicator" aria-hidden="true"></div>
    </section>
  </main>
  <script src="../naver-map.js"></script>
<link rel="stylesheet" href="../map-location-picker.css" />
<script src="../map-location-picker.js"></script>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/state.js"></script>
  <script src="js/rental-policy.js"></script>
  <script src="js/secure-cleanup.js"></script>
  <script src="../i18n-data.js"></script>
  <script src="js/i18n-home-data.js"></script>
  <script src="js/i18n-home.js"></script>
  <script src="../i18n.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
