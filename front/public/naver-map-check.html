<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOOV 네이버 지도 연결 확인</title>
  <style>
    body{max-width:1040px;margin:28px auto;padding:0 20px;font:16px/1.6 system-ui,sans-serif;color:#20332b;background:#f5f8f6}
    h1{font-size:26px}section{background:white;padding:20px;border:1px solid #dae5dd;border-radius:14px;margin:16px 0}
    #map{height:420px;background:#e5eee8;border-radius:12px}button{padding:10px 16px;background:#216843;color:white;border:0;border-radius:8px;cursor:pointer}
    button:disabled{opacity:.5;cursor:wait}input,select{padding:9px;border:1px solid #abbeb0;border-radius:6px;font:inherit;max-width:100%;box-sizing:border-box}
    form,.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}#query{flex:1;min-width:180px}.coords input{width:150px}#results button{margin:4px}#status,#route-status,#address-status{white-space:pre-wrap}small{display:block;color:#506459}a{color:#216843}
  </style>
  <script src="/naver-map-check.js" defer></script>
</head>
<body>
  <h1>네이버 지도 연결 확인</h1>
  <p>지도·주소·자동차 경로를 확인하는 개발용 페이지입니다. <a href="/">MOOV로 돌아가기</a></p>
  <p id="status" role="status">연결 설정을 확인하고 있습니다…</p>
  <section>
    <form id="search-form"><label for="query">도로명·지번 주소</label><input id="query" value="서울특별시 성동구 왕십리로 83" required minlength="2" maxlength="200"><button>주소 검색</button></form>
    <small>가게 이름 검색이 아닌 주소 검색입니다. 검색 결과에서 한글·영문 주소를 확인하세요.</small>
    <p id="address-status" role="status"></p><div id="results"></div>
  </section>
  <section>
    <label for="point-target">지도에서 클릭할 위치: </label><select id="point-target"><option value="start">출발지</option><option value="goal">목적지</option></select>
    <div id="map" aria-label="네이버 지도"></div>
    <p id="picked-address" role="status"></p>
  </section>
  <section>
    <form id="route-form">
      <div class="coords"><strong>출발지</strong> <label>위도 <input id="start-lat" type="number" step="any" min="-90" max="90" value="37.5446" required></label> <label>경도 <input id="start-lng" type="number" step="any" min="-180" max="180" value="127.0557" required></label></div>
      <div class="coords"><strong>목적지</strong> <label>위도 <input id="goal-lat" type="number" step="any" min="-90" max="90" value="37.5445" required></label> <label>경도 <input id="goal-lng" type="number" step="any" min="-180" max="180" value="127.0374" required></label></div>
      <button>자동차 경로 확인</button>
    </form>
    <p id="route-status" role="status"></p>
  </section>
</body>
</html>
