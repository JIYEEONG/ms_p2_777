<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embedded");</script>
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="MOOV 무인차 플랫폼의 차량 공간 서비스" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2356b97b'/%3E%3Cpath d='M9 22V10h3.5l3.5 6 3.5-6H23v12h-3v-7l-3 5h-2l-3-5v7z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/wellness.css" />
    <link rel="stylesheet" href="./css/embed.css" />
    <title>MOOV 공간</title>
  </head>
  <body>
    <div class="experience-shell">
      <aside class="platform-intro" aria-label="MOOV 플랫폼 소개">
        <div class="intro-brand"><span class="brand-mark">M</span><strong>MOOV</strong></div>
        <p class="intro-kicker">AUTONOMOUS MOBILITY PLATFORM</p>
        <h2>이동부터 휴식까지,<br />한 번에 MOOV.</h2>
        <p class="intro-copy">차량 안에서 콘텐츠를 이어보고, 몸을 가볍게 풀고, 나만의 공간 테마를 선택하세요.</p>
        <div class="intro-tags" aria-label="서비스 특징">
          <span>실시간 차량 연동</span><span>Zero Trust Cabin</span><span>개인 공간</span>
        </div>
        <figure class="cabin-preview">
          <figcaption><span><i></i> LIVE CABIN</span><strong data-cabin-theme-name>3면 테마 연결 중</strong></figcaption>
          <div id="desktop-cabin-preview"></div>
        </figure>
      </aside>

      <section class="phone-frame" aria-label="MOOV 공간 모바일 앱">
        <div class="app-shell" id="app-shell">
          <div class="status-bar" aria-hidden="true">
            <strong id="clock">11:41</strong>
            <div class="device-status">
              <span class="signal-bars"><i></i><i></i><i></i><i></i></span>
              <svg><use href="#icon-wifi"></use></svg>
              <span class="battery-shape"><i></i></span>
            </div>
          </div>

          <header class="space-header">
            <div>
              <div class="app-brand"><span class="brand-mark">M</span><strong>MOOV</strong></div>
              <h1>공간</h1>
            </div>
            <div class="header-actions">
              <button class="vehicle-button" id="vehicle-button" type="button" aria-label="차량 연결 상태">
                <svg><use href="#icon-car"></use></svg><span aria-hidden="true"></span>
              </button>
              <button class="profile-button" id="profile-button" type="button" aria-label="내 정보">
                <svg><use href="#icon-user"></use></svg>
              </button>
            </div>
          </header>

          <main class="space-scroll" id="space-scroll">
            <section class="space-controls" aria-label="공간 서비스">
              <div class="primary-tabs" role="tablist" aria-label="공간 서비스 구분">
                <button type="button" role="tab" data-primary-tab="purchase">상품 구매</button>
                <button type="button" role="tab" data-primary-tab="contents">콘텐츠</button>
              </div>

              <div class="secondary-tabs" id="content-tabs" role="tablist" aria-label="콘텐츠 유형">
                <button type="button" role="tab" data-content-tab="ott">OTT</button>
                <button type="button" role="tab" data-content-tab="wellness">Wellness</button>
                <button type="button" role="tab" data-content-tab="thema">Thema</button>
              </div>
            </section>

            <section class="space-panel" id="space-panel" aria-live="polite"></section>
          </main>

          <nav class="bottom-nav" aria-label="주요 메뉴">
            <button class="nav-item" type="button" data-unavailable-nav="AI 말동무">
              <svg><use href="#icon-message"></use></svg><span data-i18n-en="AI Chat">AI 말동무</span>
            </button>
            <button class="nav-item is-active" type="button" aria-current="page">
              <svg><use href="#icon-grid"></use></svg><span>공간</span>
            </button>
            <button class="nav-item" type="button" data-unavailable-nav="홈">
              <svg><use href="#icon-home"></use></svg><span>홈</span>
            </button>
            <button class="nav-item" type="button" data-unavailable-nav="나들이">
              <svg><use href="#icon-compass"></use></svg><span>나들이</span>
            </button>
            <button class="nav-item" type="button" data-unavailable-nav="내 정보">
              <svg><use href="#icon-user"></use></svg><span>내 정보</span>
            </button>
          </nav>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="icon-car" viewBox="0 0 24 24"><path d="m5 11 1.6-4.2A2 2 0 0 1 8.5 5h7a2 2 0 0 1 1.9 1.3L19 11"/><path d="M4 11h16v7H4zM7 18v2M17 18v2M7.5 14h.01M16.5 14h.01"/></symbol>
      <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></symbol>
      <symbol id="icon-message" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 3V6a2 2 0 0 1 2-2Z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></symbol>
      <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
      <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></symbol>
      <symbol id="icon-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/></symbol>
      <symbol id="icon-wifi" viewBox="0 0 24 24"><path d="M3 9c5-4 13-4 18 0M6 13c3.5-3 8.5-3 12 0M9.5 16.5c1.5-1.2 3.5-1.2 5 0"/><circle cx="12" cy="19" r=".7" fill="currentColor" stroke="none"/></symbol>
      <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
      <symbol id="icon-skip-back" viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6Z"/></symbol>
      <symbol id="icon-skip-forward" viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6Z"/></symbol>
      <symbol id="icon-volume" viewBox="0 0 24 24"><path d="M5 10v4h4l5 4V6l-5 4H5ZM17 9c1.5 1.7 1.5 4.3 0 6M19.5 6.5c3 3 3 8 0 11"/></symbol>
      <symbol id="icon-volume-off" viewBox="0 0 24 24"><path d="M5 10v4h4l5 4V6l-5 4H5ZM17 10l4 4M21 10l-4 4"/></symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="icon-wheel" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M3 11h6M15 11h6M12 15v6"/></symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 2-2 5 4"/></symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 15v4h14v-4"/></symbol>
      <symbol id="icon-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12M9 9l10-2"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></symbol>
      <symbol id="icon-leaf" viewBox="0 0 24 24"><path d="M20 4C11 4 5 8 5 15c0 3 2 5 5 5 7 0 10-7 10-16Z"/><path d="M4 21c3-6 7-9 12-12"/></symbol>
      <symbol id="icon-wave" viewBox="0 0 24 24"><path d="M3 8c2.5 0 2.5 2 5 2s2.5-2 5-2 2.5 2 5 2 2.5-2 3-2M3 14c2.5 0 2.5 2 5 2s2.5-2 5-2 2.5 2 5 2 2.5-2 3-2"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.12.37.33.7.6 1 .3.27.7.4 1.1.4h.1v4h-.1a1.7 1.7 0 0 0-1.7.6Z"/></symbol>
    </svg>

    <script src="../i18n-data.js"></script>
    <script src="../i18n.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
