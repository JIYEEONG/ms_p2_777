    <ellipse cx="1181" cy="528" rx="110" ry="150" fill="url(#ear)" opacity=".9"/>
    <ellipse cx="768" cy="514" rx="443" ry="416" fill="url(#body)"/>
    <path d="M365 502C384 342 539 262 768 262s384 80 403 240c13 110-48 209-162 247-72 24-154 35-241 35s-169-11-241-35C413 711 352 612 365 502Z" fill="url(#rim)" filter="url(#softGlow)"/>
