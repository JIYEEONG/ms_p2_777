      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0ccf8e" flood-opacity=".35"/>
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#ffffff" flood-opacity=".75"/>
    </filter>
    <radialGradient id="body" cx="50%" cy="28%" r="68%">
