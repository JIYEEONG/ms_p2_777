<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f7f5" />
    <meta name="description" content="MOOV 앱 구현 범위와 브라우저 상태를 확인하는 운영 대시보드" />
    <title>MOOV 앱 운영 대시보드</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <div class="shell">
      <aside class="sidebar" aria-label="대시보드 메뉴">
        <div class="brand"><span>M</span><div><strong>MOOV</strong><small>APP OPERATIONS</small></div></div>
        <nav id="nav"></nav>
        <div class="scope-note"><strong>표시 원칙</strong><p>앱 코드와 현재 브라우저에 존재하는 상태만 표시합니다.</p></div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button id="menuButton" class="mobile-menu" type="button" aria-label="메뉴 열기">메뉴</button>
          <div><span class="eyebrow">MOOV CONTROL CENTER</span><strong id="pageTitle">앱 현황</strong></div>
          <div class="top-actions">
            <span id="updatedAt" class="updated-at"></span>
            <button id="refreshButton" class="button secondary" type="button">새로고침</button>
            <button id="themeButton" class="button icon" type="button" aria-label="색상 모드 전환">테마</button>
          </div>
        </header>

        <main id="main" tabindex="-1">
          <section class="page-heading">
            <div><p id="breadcrumb">MOOV / 앱 현황</p><h1 id="heading">앱 현황</h1><p id="description">배포 앱에 구현된 기능과 현재 데이터 범위를 확인합니다.</p></div>
            <span class="scope-badge">APP-SOURCED ONLY</span>
          </section>
          <section id="view" aria-live="polite"></section>
        </main>
      </div>
    </div>
    <button id="overlay" class="overlay" type="button" aria-label="메뉴 닫기" hidden></button>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
